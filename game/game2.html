<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Trigonometry Game</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e6f2ff;
    color: #003366;
    text-align: center;
    overflow: hidden;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0; /* canvas behind UI */
  }

  #ui {
    position: relative;
    z-index: 10; /* UI above canvas */
    padding-top: 20px;
  }

  #question {
    font-size: 1.5em;
    margin: 10px;
  }

  #answerInput {
    font-size: 1.2em;
    padding: 5px;
    width: 150px;
  }

  #checkBtn {
    font-size: 1.2em;
    padding: 5px 15px;
    margin-left: 10px;
    cursor: pointer;
  }

  #feedback {
    font-size: 1.3em;
    margin: 10px;
    min-height: 1.5em;
  }

  #helpBox {
    background: #cce6ff;
    border: 1px solid #003366;
    width: 300px;
    margin: 10px auto;
    padding: 15px;
    text-align: left;
    font-size: 0.9em;
  }
</style>
</head>
<body>

<div id="ui">
  <h1>3D Trigonometry Game</h1>
  <div id="question"></div>
  <input type="text" id="answerInput" placeholder="Enter answer (e.g. 1/2 or 0.5)" />
  <button id="checkBtn">Check</button>
  <div id="feedback"></div>
  <div id="helpBox">
    <h3>Trig Formulas</h3>
    <p>sin(θ) = Opposite / Hypotenuse</p>
    <p>cos(θ) = Adjacent / Hypotenuse</p>
    <p>tan(θ) = Opposite / Adjacent</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.164.0/examples/js/controls/OrbitControls.js"></script>

<script>
  // --- TRIG DATA ---
  const trigTable = {
    30: { sin: ['1/2', 0.5], cos: ['√3/2', Math.sqrt(3)/2], tan: ['1/√3', 1/Math.sqrt(3)] },
    45: { sin: ['1/√2', Math.SQRT1_2], cos: ['1/√2', Math.SQRT1_2], tan: ['1', 1] },
    60: { sin: ['√3/2', Math.sqrt(3)/2], cos: ['1/2', 0.5], tan: ['√3', Math.sqrt(3)] }
  };
  const angles = [30, 45, 60];
  const funcs = ['sin', 'cos', 'tan'];
  let currentAngle = null;
  let currentFunc = null;

  // --- THREE.JS SETUP ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe6f2ff);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(250, 200, 250);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(75, 75, 0);
  controls.update();

  // Lighting
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(100, 200, 100);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));

  // Helpers
  scene.add(new THREE.AxesHelper(100));
  scene.add(new THREE.GridHelper(200, 10));

  let triangleMesh, hypotenuseLine, sideLines;

  const hypMaterial = new THREE.LineBasicMaterial({ color: 0xff0000 });
  const sideMaterial = new THREE.LineBasicMaterial({ color: 0x003366 });
  const faceMaterial = new THREE.MeshLambertMaterial({ color: 0x99ccff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });

  // --- CREATE TRIANGLE ---
  function drawTriangle3D() {
    if (triangleMesh) scene.remove(triangleMesh);
    if (hypotenuseLine) scene.remove(hypotenuseLine);
    if (sideLines) scene.remove(sideLines);

    const hypotenuse = 150;
    const rad = currentAngle * Math.PI / 180;
    const adjacent = Math.cos(rad) * hypotenuse;
    const opposite = Math.sin(rad) * hypotenuse;

    console.log({ adjacent, opposite, hypotenuse });

    // Triangle face
    const geometry = new THREE.BufferGeometry();
    const vertices = new Float32Array([
      0, 0, 0,            // A = right angle
      adjacent, 0, 0,     // B = adjacent
      0, opposite, 0      // C = opposite
    ]);
    geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geometry.setIndex([0, 1, 2]);
    triangleMesh = new THREE.Mesh(geometry, faceMaterial);
    scene.add(triangleMesh);

    // Triangle edges
    const sidePoints = [
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(adjacent, 0, 0),
      new THREE.Vector3(0, opposite, 0),
      new THREE.Vector3(0, 0, 0)
    ];
    const sideGeometry = new THREE.BufferGeometry().setFromPoints(sidePoints);
    sideLines = new THREE.Line(sideGeometry, sideMaterial);
    scene.add(sideLines);

    // Hypotenuse line (red)
    const hypoGeometry = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(adjacent, 0, 0),
      new THREE.Vector3(0, opposite, 0)
    ]);
    hypotenuseLine = new THREE.Line(hypoGeometry, hypMaterial);
    scene.add(hypotenuseLine);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // --- GAME LOGIC ---
  function newQuestion() {
    currentAngle = angles[Math.floor(Math.random() * angles.length)];
    currentFunc = funcs[Math.floor(Math.random() * funcs.length)];
    document.getElementById('feedback').textContent = '';
    document.getElementById('answerInput').value = '';
    document.getElementById('question').textContent = `What is ${currentFunc}(${currentAngle}°)?`;
    drawTriangle3D();
  }

  function normalizeAnswer(input) {
    input = input.trim().toLowerCase().replace(/√/g, 'sqrt');
    if (input.includes('/')) {
      const parts = input.split('/');
      return evalSqrt(parts[0]) / evalSqrt(parts[1]);
    } else {
      return evalSqrt(input);
    }
  }

  function evalSqrt(str) {
    if (str.startsWith('sqrt')) {
      return Math.sqrt(parseFloat(str.substring(4)));
    } else {
      return parseFloat(str);
    }
  }

  function checkAnswer() {
    const userInput = document.getElementById('answerInput').value;
    if (!userInput) return alert('Please enter your answer!');
    const userVal = normalizeAnswer(userInput);
    if (isNaN(userVal)) return alert('Invalid input. Use fractions like "1/2" or decimals like "0.5".');
    const correctDecimal = trigTable[currentAngle][currentFunc][1];
    if (Math.abs(userVal - correctDecimal) < 0.01) {
      document.getElementById('feedback').textContent = '✅ Correct! 🎉';
      setTimeout(newQuestion, 1500);
    } else {
      document.getElementById('feedback').textContent = `❌ Wrong. Try again! (≈ ${correctDecimal.toFixed(3)})`;
    }
  }

  document.getElementById('checkBtn').addEventListener('click', checkAnswer);
  newQuestion();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
