<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Geometry Explorer 3D</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #101020;
    }
    canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <!-- ✅ Core Babylon.js libraries -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <script src="https://cdn.babylonjs.com/earcut.min.js"></script> <!-- Needed for ExtrudePolygon -->

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.05, 0.05, 0.1);

      // Lighting
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0.2, 1, 0.2), scene);
      light.intensity = 0.9;

      // Ground
      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 200, height: 200 }, scene);
      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.5, 0.2);
      ground.material = groundMat;
      ground.checkCollisions = true;

      // Camera setup
      const camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 2, 0), scene);
      camera.attachControl(canvas, true);
      camera.speed = 0.5;
      camera.angularSensibility = 4000;
      camera.applyGravity = true;
      camera.ellipsoid = new BABYLON.Vector3(1, 1, 1);
      scene.gravity = new BABYLON.Vector3(0, -0.9, 0);
      scene.collisionsEnabled = true;
      camera.checkCollisions = true;

      // Movement keys
      camera.keysUp.push(87);   // W
      camera.keysDown.push(83); // S
      camera.keysLeft.push(65); // A
      camera.keysRight.push(68);// D

      // GUI setup
      const gui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

      const titleText = new BABYLON.GUI.TextBlock();
      titleText.text = "Geometry Explorer 3D";
      titleText.color = "white";
      titleText.fontSize = 28;
      titleText.top = "-45%";
      gui.addControl(titleText);

      const scoreText = new BABYLON.GUI.TextBlock();
      scoreText.text = "Score: 0";
      scoreText.color = "yellow";
      scoreText.fontSize = 24;
      scoreText.top = "-40%";
      gui.addControl(scoreText);

      const infoPanel = new BABYLON.GUI.Rectangle();
      infoPanel.width = "25%";
      infoPanel.height = "40%";
      infoPanel.color = "white";
      infoPanel.thickness = 2;
      infoPanel.cornerRadius = 10;
      infoPanel.background = "rgba(0,0,0,0.6)";
      infoPanel.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
      infoPanel.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
      infoPanel.top = "5%";
      infoPanel.left = "-5%";
      gui.addControl(infoPanel);

      const infoText = new BABYLON.GUI.TextBlock();
      infoText.text = "Click a shape to learn more!";
      infoText.color = "white";
      infoText.textWrapping = true;
      infoText.resizeToFit = true;
      infoText.fontSize = 20;
      infoPanel.addControl(infoText);

      let score = 0;

      // Shape data
      const shapeData = {
        "Cube": { type: "3D", faces: 6, edges: 12, vertices: 8, fact: "All faces are equal squares." },
        "Sphere": { type: "3D", faces: "1 curved", edges: 0, vertices: 0, fact: "Every point is equidistant from the center." },
        "Cylinder": { type: "3D", faces: 3, edges: 2, vertices: 0, fact: "It has two circular faces and one curved surface." },
        "Cone": { type: "3D", faces: 2, edges: 1, vertices: 1, fact: "It has one circular face and one vertex at the tip." },
        "Triangular Pyramid": { type: "3D", faces: 4, edges: 6, vertices: 4, fact: "Also called a tetrahedron." },
        "Square Pyramid": { type: "3D", faces: 5, edges: 8, vertices: 5, fact: "It has a square base and four triangular faces." },
        "Triangle": { type: "2D", sides: 3, vertices: 3, fact: "The sum of angles is always 180°." },
        "Square": { type: "2D", sides: 4, vertices: 4, fact: "All sides and angles are equal." },
        "Pentagon": { type: "2D", sides: 5, vertices: 5, fact: "Interior angles sum to 540°." },
        "Hexagon": { type: "2D", sides: 6, vertices: 6, fact: "Common in honeycomb structures." },
      };

      const shapeTypes = Object.keys(shapeData);

      // Create 2D shape
            function create2DShape(name, sides, position) {
        const shape2D = [];
        for (let i = 0; i < sides; i++) {
          const angle = (i / sides) * Math.PI * 2;
          shape2D.push(new BABYLON.Vector3(Math.cos(angle), 0, Math.sin(angle))); // note Y=0, shape in XZ plane
        }
        const polygon = BABYLON.MeshBuilder.ExtrudePolygon(name, { shape: shape2D, depth: 0.2 }, scene);
        polygon.position = position.add(new BABYLON.Vector3(0, 0.1, 0)); // slightly above ground

        const mat = new BABYLON.StandardMaterial(name + "Mat", scene);
        mat.diffuseColor = new BABYLON.Color3(Math.random(), Math.random(), Math.random());
        polygon.material = mat;
        return polygon;
      }
      const env = scene.createDefaultEnvironment({
       enableGroundShadow: true,
       groundYBias: 0.2,
       skyboxColor: new BABYLON.Color3(0.5, 0.7, 1)
      });
      scene.environmentIntensity = 1.5;


      // Create 3D shape
      function createShape(name, position) {
  let mesh;
  switch (name) {
    case "Cube":
      mesh = BABYLON.MeshBuilder.CreateBox(name, {}, scene);
      break;
    case "Sphere":
      mesh = BABYLON.MeshBuilder.CreateSphere(name, { diameter: 2 }, scene);
      break;
    case "Cylinder":
      mesh = BABYLON.MeshBuilder.CreateCylinder(name, { height: 2, diameter: 1.5 }, scene);
      break;
    case "Cone":
      mesh = BABYLON.MeshBuilder.CreateCylinder(name, { height: 2, diameterTop: 0 }, scene);
      break;
    case "Triangular Pyramid":
  // Properly oriented upright tetrahedron
  const tetraPositions = [
    0, 1.5, 0,    // Apex
    -1, 0, -1,
     1, 0, -1,
     0, 0, 1
  ];

  const tetraIndices = [
    0, 1, 2,  // front face
    0, 2, 3,  // right face
    0, 3, 1,  // left face
    1, 3, 2   // base (triangle)
  ];

  mesh = new BABYLON.Mesh(name, scene);
  const tetraData = new BABYLON.VertexData();
  tetraData.positions = tetraPositions;
  tetraData.indices = tetraIndices;
  tetraData.normals = [];
  BABYLON.VertexData.ComputeNormals(tetraData.positions, tetraData.indices, tetraData.normals);
  tetraData.applyToMesh(mesh);
  break;


    case "Square Pyramid": {
      const positions = [
        -1, 0, -1,
         1, 0, -1,
         1, 0,  1,
        -1, 0,  1,
         0, 1.5, 0
      ];
      const indices = [
        0, 1, 2, 0, 2, 3,
        0, 1, 4,
        1, 2, 4,
        2, 3, 4,
        3, 0, 4
      ];
      mesh = new BABYLON.Mesh(name, scene);
      const vertexData = new BABYLON.VertexData();
      vertexData.positions = positions;
      vertexData.indices = indices;
      vertexData.normals = [];
      BABYLON.VertexData.ComputeNormals(vertexData.positions, vertexData.indices, vertexData.normals);
      vertexData.applyToMesh(mesh);
      break;
    }

    case "Triangle": return create2DShape(name, 3, position);
    case "Square": return create2DShape(name, 4, position);
    case "Pentagon": return create2DShape(name, 5, position);
    case "Hexagon": return create2DShape(name, 6, position);
  }

  mesh.position = position;
  const mat = new BABYLON.StandardMaterial(name + "Mat", scene);
  mat.diffuseColor = new BABYLON.Color3(Math.random(), Math.random(), Math.random());
  mesh.material = mat;
  mesh.checkCollisions = true;
  return mesh;
}

      // Spawn shapes randomly
      for (let i = 0; i < 25; i++) {
        const type = shapeTypes[Math.floor(Math.random() * shapeTypes.length)];
        const x = Math.random() * 180 - 90;
        const z = Math.random() * 180 - 90;
        const y = 1;
        const shape = createShape(type, new BABYLON.Vector3(x, y, z));
        shape.name = type;
      }

      // Rotate 2D shapes slightly
      scene.onBeforeRenderObservable.add(() => {
        const deltaTime = engine.getDeltaTime() / 1000;
        scene.meshes.forEach(mesh => {
          if (["Triangle", "Square", "Pentagon", "Hexagon"].includes(mesh.name)) {
            mesh.rotation.y += deltaTime * 0.8;
          }
        });
      });

      // Click interaction
      window.addEventListener("click", function () {
        const pickResult = scene.pick(scene.pointerX, scene.pointerY);
        if (pickResult.hit && pickResult.pickedMesh) {
          const mesh = pickResult.pickedMesh;
          if (mesh.alreadyClicked) return;
          mesh.alreadyClicked = true;

          const data = shapeData[mesh.name];
          mesh.material.diffuseColor = new BABYLON.Color3(0, 1, 0);
          score++;
          scoreText.text = `Score: ${score}`;

          if (data.type === "3D") {
            infoText.text = `🧊 ${mesh.name}\nType: 3D Shape\nFaces: ${data.faces}\nEdges: ${data.edges}\nVertices: ${data.vertices}\nFact: ${data.fact}`;
          } else {
            infoText.text = `📐 ${mesh.name}\nType: 2D Shape\nSides: ${data.sides}\nVertices: ${data.vertices}\nFact: ${data.fact}`;
          }
        }
      });

      return scene;
    };

    const scene = createScene();
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
