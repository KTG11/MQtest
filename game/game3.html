<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Algebra Explorer 3D</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #101020;
    }
    canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.05, 0.05, 0.1);

      // Lighting
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0.2, 1, 0.2), scene);
      light.intensity = 0.9;

      // Ground
      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 200, height: 200 }, scene);
      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.4, 0.2);
      ground.material = groundMat;

      // Camera
      const camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 5, -10), scene);
      camera.attachControl(canvas, true);
      camera.speed = 0.5;
      camera.applyGravity = true;

      // Give the camera a capsule shape for collisions
      camera.ellipsoid = new BABYLON.Vector3(1, 1, 1);
      camera.checkCollisions = true;

      // Enable collisions + gravity globally
      scene.gravity = new BABYLON.Vector3(0, -0.9, 0);
      scene.collisionsEnabled = true;

      // Ensure ground blocks falling
      ground.checkCollisions = true;


      camera.keysUp.push(87);  // W
      camera.keysDown.push(83);// S
      camera.keysLeft.push(65);// A
      camera.keysRight.push(68);// D

      // GUI
      const gui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");
      const titleText = new BABYLON.GUI.TextBlock();
      titleText.text = "🔮 Algebra Explorer 3D";
      titleText.color = "white";
      titleText.fontSize = 28;
      titleText.top = "-45%";
      gui.addControl(titleText);

      const scoreText = new BABYLON.GUI.TextBlock();
      scoreText.text = "Score: 0";
      scoreText.color = "yellow";
      scoreText.fontSize = 24;
      scoreText.top = "-40%";
      gui.addControl(scoreText);

      const infoBox = new BABYLON.GUI.TextBlock();
      infoBox.text = "Click a floating orb to solve its equation!";
      infoBox.color = "white";
      infoBox.fontSize = 20;
      infoBox.textWrapping = true;
      infoBox.top = "-30%";
      gui.addControl(infoBox);

      let score = 0;

      // Function to create a random equation
      function createEquation() {
        const a = Math.floor(Math.random() * 9) + 1;
        const b = Math.floor(Math.random() * 10);
        const x = Math.floor(Math.random() * 10);
        const c = a * x + b;
        return { eq: `${a}x + ${b} = ${c}`, answer: x };
      }

      // Create Algebra Orbs
      const orbCount = 15;
      for (let i = 0; i < orbCount; i++) {
        const { eq, answer } = createEquation();

        const orb = BABYLON.MeshBuilder.CreateSphere("orb", { diameter: 2 }, scene);
        orb.position = new BABYLON.Vector3(
          Math.random() * 180 - 90,
          2 + Math.random() * 3,
          Math.random() * 180 - 90
        );

        const mat = new BABYLON.StandardMaterial("orbMat", scene);
        mat.emissiveColor = new BABYLON.Color3(Math.random(), Math.random(), Math.random());
        orb.material = mat;

        orb.metadata = { eq, answer, solved: false };
      }

      // Floating animation
      scene.onBeforeRenderObservable.add(() => {
        scene.meshes.forEach(mesh => {
          if (mesh.name === "orb" && !mesh.metadata.solved) {
            mesh.position.y += Math.sin(performance.now() / 1000 + mesh.position.x) * 0.002;
            mesh.rotation.y += 0.01;
          }
        });
      });

      // Click handling
      window.addEventListener("click", () => {
        const pick = scene.pick(scene.pointerX, scene.pointerY);
        if (pick.hit && pick.pickedMesh && pick.pickedMesh.name === "orb") {
          const orb = pick.pickedMesh;
          if (orb.metadata.solved) return;

          const userAnswer = prompt(`Solve for x:\n\n${orb.metadata.eq}`);
          if (userAnswer === null) return; // Cancelled

          if (parseInt(userAnswer) === orb.metadata.answer) {
            orb.metadata.solved = true;
            orb.material.emissiveColor = new BABYLON.Color3(0, 1, 0);
            score += 10;
            infoBox.text = `✅ Correct! ${orb.metadata.eq} → x = ${orb.metadata.answer}`;
          } else {
            orb.material.emissiveColor = new BABYLON.Color3(1, 0, 0);
            score -= 5;
            infoBox.text = `❌ Oops! The correct answer was x = ${orb.metadata.answer}`;
          }

          scoreText.text = `Score: ${score}`;
        }
      });

      return scene;
    };

    const scene = createScene();
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
