<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Explorer 3D with Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #101020; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.min.js"></script>
  <script>
    let scene, camera, renderer, score = 0, scoreText;
    const shapeData = {
      "Cube": { type: "3D", faces: 6, edges: 12, vertices: 8, fact: "All faces are equal squares." },
      "Sphere": { type: "3D", faces: "1 curved", edges: 0, vertices: 0, fact: "Every point is equidistant from the center." },
      "Cylinder": { type: "3D", faces: 3, edges: 2, vertices: 0, fact: "It has two circular faces and one curved surface." },
      "Cone": { type: "3D", faces: 2, edges: 1, vertices: 1, fact: "It has one circular face and one vertex at the tip." },
      "Triangular Pyramid": { type: "3D", faces: 4, edges: 6, vertices: 4, fact: "Also called a tetrahedron." },
      "Square Pyramid": { type: "3D", faces: 5, edges: 8, vertices: 5, fact: "It has a square base and four triangular faces." },
      "Triangle": { type: "2D", sides: 3, vertices: 3, fact: "The sum of angles is always 180°." },
      "Square": { type: "2D", sides: 4, vertices: 4, fact: "All sides and angles are equal." },
      "Pentagon": { type: "2D", sides: 5, vertices: 5, fact: "Interior angles sum to 540°." },
      "Hexagon": { type: "2D", sides: 6, vertices: 6, fact: "Common in honeycomb structures." }
    };

    const shapeTypes = Object.keys(shapeData);
    let raycaster, mouse, intersectedObject = null;

    // Scene setup
    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3, 10);

      renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Debug: Check if Three.js loaded
      console.log("Three.js is loaded!");

      // Lighting
      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
      scene.add(light);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
      directionalLight.position.set(5, 5, 5).normalize();
      scene.add(directionalLight);

      // Raycaster setup
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // GUI setup for score
      setupGUI();

      // Handle window resize
      window.addEventListener('resize', onWindowResize);

      // Add 3D shapes
      spawnShapes();

      // Mouse click event for interaction
      window.addEventListener('click', onMouseClick, false);

      // Debugging render loop
      animate();
    }

    // GUI for score and shape info
    function setupGUI() {
      const gui = new dat.GUI();
      scoreText = { score: score, info: "Click a shape to explore!" };
      gui.add(scoreText, 'score').name('Score').listen();
      gui.add(scoreText, 'info').name('Info').listen();
    }

    // Handle window resize
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Spawn random shapes in the scene
    function spawnShapes() {
      for (let i = 0; i < 5; i++) { // Reduce to 5 shapes for simplicity
        const type = shapeTypes[Math.floor(Math.random() * shapeTypes.length)];
        const x = Math.random() * 180 - 90;
        const z = Math.random() * 180 - 90;
        const y = 1;
        const shape = createShape(type, x, y, z);
        shape.name = type;
        scene.add(shape);
      }
    }

    // Create shapes
    function createShape(type, x, y, z) {
      let geometry, material, mesh;

      switch (type) {
        case 'Cube':
          geometry = new THREE.BoxGeometry(2, 2, 2);
          break;
        case 'Sphere':
          geometry = new THREE.SphereGeometry(1);
          break;
        case 'Cylinder':
          geometry = new THREE.CylinderGeometry(1, 1, 2, 32);
          break;
        case 'Cone':
          geometry = new THREE.ConeGeometry(1, 2, 32);
          break;
        case 'Triangular Pyramid':
          geometry = new THREE.ConeGeometry(1, 2, 3); // A cone with 3 sides forms a pyramid
          break;
        case 'Square Pyramid':
          geometry = new THREE.ConeGeometry(1, 2, 4); // A cone with 4 sides forms a square pyramid
          break;
        default:
          geometry = new THREE.BoxGeometry(1, 1, 1); // Default cube if not found
      }

      material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
      mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);

      mesh.castShadow = true;
      mesh.receiveShadow = true;

      return mesh;
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      // Rotate shapes for visual interest
      scene.children.forEach(child => {
        if (child instanceof THREE.Mesh) {
          child.rotation.y += 0.01;
        }
      });

      // Render the scene and camera
      renderer.render(scene, camera);
    }

    // Handle mouse clicks
    function onMouseClick(event) {
      // Normalize mouse coordinates
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      // Update the raycaster with the mouse coordinates
      raycaster.update(camera, renderer.domElement);
      raycaster.setFromCamera(mouse, camera);

      // Find the intersections
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        const intersectedMesh = intersects[0].object;
        if (!intersectedMesh.selected) {
          intersectedMesh.selected = true;
          intersectedMesh.material.color.set(0x00ff00); // Change color when clicked

          // Increase score
          score++;
          scoreText.score = score;

          // Display shape info
          const data = shapeData[intersectedMesh.name];
          scoreText.info = `Name: ${intersectedMesh.name}\nType: ${data.type}\nFact: ${data.fact}`;
        }
      }
    }

    // Initialize the game
    init();
  </script>
</body>
</html>
