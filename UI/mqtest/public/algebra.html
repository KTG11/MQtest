<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Adventure 3D - Floating Orbs</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }
    #questionBox {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      padding: 20px;
      border-radius: 10px;
      display: none;
      text-align: center;
      width: 300px;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      border-radius: 8px;
    }
    input {
      width: 80%;
      padding: 5px;
      margin-top: 10px;
    }
    button {
      margin-top: 10px;
      padding: 5px 10px;
    }
  </style>
</head>
<body>
  <div id="hud">Score: <span id="score">0</span></div>
  <div id="questionBox">
    <h2>Solve:</h2>
    <p id="question"></p>
    <input type="text" id="answerInput" placeholder="Enter answer" />
    <br>
    <button id="submitAnswer">Submit</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    let scene, camera, renderer, raycaster, mouse;
    let move = { forward: false, back: false, left: false, right: false };
    let velocity = 0.2;
    let score = 0;
    const hud = document.getElementById("score");
    const questionBox = document.getElementById("questionBox");
    const questionText = document.getElementById("question");
    const answerInput = document.getElementById("answerInput");
    const submitButton = document.getElementById("submitAnswer");

    let currentOrb = null;
    let currentAnswer = null;
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let rotationSpeed = 0.005;

    let orbs = [];
    let trees = [];
    let clock = new THREE.Clock();

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(20, 30, 10);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));

      // === Generate Hilly Terrain ===
      const size = 200;
      const divisions = 128;
      const terrainGeometry = new THREE.PlaneGeometry(size, size, divisions, divisions);
      terrainGeometry.rotateX(-Math.PI / 2);

      const pos = terrainGeometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const y = Math.sin(x * 0.1) * 2 + Math.cos(z * 0.1) * 2; // hills
        pos.setY(i, y);
      }
      pos.needsUpdate = true;
      terrainGeometry.computeVertexNormals();

      const terrainMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
      const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
      scene.add(terrain);

      // === Create trees ===
      createTrees(size);

      // === Create glowing floating orbs ===
      const orbGeometry = new THREE.SphereGeometry(0.5, 32, 32);
      const orbMaterial = new THREE.MeshPhongMaterial({
        color: 0xffff00,
        emissive: 0xffa500,
        emissiveIntensity: 1
      });

      for (let i = 0; i < 15; i++) {
        const orb = new THREE.Mesh(orbGeometry, orbMaterial.clone());
        const x = Math.random() * size - size / 2;
        const z = Math.random() * size - size / 2;
        const yBase = getTerrainHeight(x, z) + 1.5; // start a bit above ground
        orb.position.set(x, yBase, z);
        orb.userData = { isOrb: true, baseY: yBase, phase: Math.random() * Math.PI * 2 }; // unique floating pattern
        orbs.push(orb);
        scene.add(orb);
      }

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      window.addEventListener("resize", onWindowResize);
      window.addEventListener("click", onClick);
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      renderer.domElement.addEventListener("mousedown", onMouseDown);
      renderer.domElement.addEventListener("mouseup", onMouseUp);
      renderer.domElement.addEventListener("mousemove", onMouseMove);

      submitButton.addEventListener("click", checkAnswer);
      answerInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") checkAnswer();
      });
    }

    function createTrees(terrainSize) {
      // Create tree components
      const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.5, 3, 8);
      const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
      
      // Different types of tree tops for variety
      const coneGeometry = new THREE.ConeGeometry(2, 4, 8);
      const sphereGeometry = new THREE.SphereGeometry(2, 8, 6);
      const treeTopMaterials = [
        new THREE.MeshLambertMaterial({ color: 0x228B22 }),
        new THREE.MeshLambertMaterial({ color: 0x2E8B57 }),
        new THREE.MeshLambertMaterial({ color: 0x006400 })
      ];

      // Create multiple trees
      const treeCount = 50;
      for (let i = 0; i < treeCount; i++) {
        // Create a group to hold trunk and leaves
        const tree = new THREE.Group();
        
        // Create trunk
        const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
        trunk.position.y = 1.5; // Half of trunk height
        tree.add(trunk);
        
        // Create tree top with random geometry and material
        const useCone = Math.random() > 0.5;
        const treeTopGeometry = useCone ? coneGeometry : sphereGeometry;
        const materialIndex = Math.floor(Math.random() * treeTopMaterials.length);
        const treeTop = new THREE.Mesh(treeTopGeometry, treeTopMaterials[materialIndex]);
        
        // Position tree top
        treeTop.position.y = 3 + (useCone ? 2 : 0); // Adjust based on geometry type
        tree.add(treeTop);
        
        // Random scale for variety
        const scale = 0.7 + Math.random() * 0.6;
        tree.scale.set(scale, scale, scale);
        
        // Random position on terrain
        const x = Math.random() * terrainSize - terrainSize / 2;
        const z = Math.random() * terrainSize - terrainSize / 2;
        const y = getTerrainHeight(x, z);
        
        tree.position.set(x, y, z);
        
        // Random rotation
        tree.rotation.y = Math.random() * Math.PI * 2;
        
        trees.push(tree);
        scene.add(tree);
      }
    }

    function getTerrainHeight(x, z) {
      return Math.sin(x * 0.1) * 2 + Math.cos(z * 0.1) * 2;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onClick(event) {
      if (questionBox.style.display === "block") return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(orbs);
      if (intersects.length > 0) {
        const obj = intersects[0].object;
        if (obj.userData.isOrb) {
          currentOrb = obj;
          const { question, answer } = generateAlgebraQuestion();
          currentAnswer = answer;
          questionText.textContent = question;
          questionBox.style.display = "block";
          answerInput.value = "";
          answerInput.focus();
        }
      }
    }

    function generateAlgebraQuestion() {
      const a = Math.floor(Math.random() * 10) + 1;
      const b = Math.floor(Math.random() * 10) + 1;
      const x = Math.floor(Math.random() * 10) + 1;
      const c = a * x + b;
      return { question: `${a}x + ${b} = ${c}. Find x.`, answer: x };
    }

    function checkAnswer() {
      const userAnswer = parseFloat(answerInput.value);
      if (userAnswer === currentAnswer) {
        score += 10;
        hud.textContent = score;
        currentOrb.material.color.set(0x00ff00);
        currentOrb.material.emissive.set(0x00ff00);
        currentOrb.userData.isOrb = false;
        questionBox.style.display = "none";
      } else {
        alert("Incorrect! Try again.");
      }
    }

    function onKeyDown(e) {
      if (e.key === "w") move.forward = true;
      if (e.key === "s") move.back = true;
      if (e.key === "a") move.left = true;
      if (e.key === "d") move.right = true;
    }

    function onKeyUp(e) {
      if (e.key === "w") move.forward = false;
      if (e.key === "s") move.back = false;
      if (e.key === "a") move.left = false;
      if (e.key === "d") move.right = false;
    }

    function onMouseDown(event) {
      isDragging = true;
      previousMousePosition.x = event.clientX;
    }

    function onMouseUp() {
      isDragging = false;
    }

    function onMouseMove(event) {
      if (!isDragging) return;
      const deltaMove = { x: event.clientX - previousMousePosition.x };
      camera.rotation.y -= deltaMove.x * rotationSpeed;
      previousMousePosition.x = event.clientX;
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // === Float the orbs up and down ===
      for (let orb of orbs) {
        const { baseY, phase } = orb.userData;
        orb.position.y = baseY + Math.sin(time * 2 + phase) * 0.5;
      }

      // Move camera
      const direction = new THREE.Vector3();
      if (move.forward) direction.z -= velocity;
      if (move.back) direction.z += velocity;
      if (move.left) direction.x -= velocity;
      if (move.right) direction.x += velocity;

      camera.position.add(direction.applyEuler(camera.rotation));
      camera.position.y = 5 + getTerrainHeight(camera.position.x, camera.position.z);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
