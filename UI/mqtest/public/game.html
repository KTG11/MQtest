<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Algebra Game</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #101020;
      }
      canvas {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <!-- Import Babylon.js packages using ES modules -->
    <script type="module">
      import { Engine, Scene, Color3, ArcRotateCamera, HemisphericLight, MeshBuilder, StandardMaterial, ActionManager, ExecuteCodeAction } from '@babylonjs/core';
      import { AdvancedDynamicTexture, TextBlock } from '@babylonjs/gui';

      const canvas = document.getElementById("renderCanvas");
      const engine = new Engine(canvas, true);

      const createScene = () => {
        const scene = new Scene(engine);
        scene.clearColor = new Color3(0.05, 0.05, 0.1);

        // Camera
        const camera = new ArcRotateCamera("camera", Math.PI / 2, Math.PI / 3, 10, Vector3.Zero(), scene);
        camera.attachControl(canvas, true);

        // Light
        new HemisphericLight("light", new Vector3(0, 1, 0), scene);

        // GUI overlay
        const gui = AdvancedDynamicTexture.CreateFullscreenUI("UI");

        const questionText = new TextBlock();
        questionText.color = "white";
        questionText.fontSize = 36;
        questionText.top = "-40%";
        gui.addControl(questionText);

        const scoreText = new TextBlock();
        scoreText.color = "yellow";
        scoreText.fontSize = 28;
        scoreText.top = "-47%";
        scoreText.left = "40%";
        gui.addControl(scoreText);

        let score = 0;
        let currentAnswer = 0;
        let cubes = [];

        // Generate random equation (a*x + b = c)
        function generateEquation() {
          const a = Math.floor(Math.random() * 4) + 1;
          const x = Math.floor(Math.random() * 10);
          const b = Math.floor(Math.random() * 8) - 4; // allows negatives
          const c = a * x + b;
          return { question: `${a}x + ${b} = ${c}`, answer: x };
        }

        // Spawn cubes with answers
        function spawnAnswers(correctAnswer) {
          cubes.forEach((c) => c.dispose());
          cubes = [];

          const answers = new Set([correctAnswer]);
          while (answers.size < 3) {
            answers.add(correctAnswer + Math.floor(Math.random() * 6) - 3);
          }

          const answerArray = Array.from(answers).sort(() => Math.random() - 0.5);

          for (let i = 0; i < answerArray.length; i++) {
            const cube = MeshBuilder.CreateBox("cube" + i, {}, scene);
            cube.position = new Vector3(-4 + i * 4, 0, 0);

            const mat = new StandardMaterial("mat" + i, scene);
            mat.diffuseColor = new Color3(0.2, 0.5, 1);
            cube.material = mat;

            // Floating animation
            scene.registerBeforeRender(() => {
              cube.position.y = Math.sin(performance.now() / 500 + i) * 0.5;
            });

            cube.answerValue = answerArray[i];
            cubes.push(cube);

            // --- Larger label above cube ---
            const plane = MeshBuilder.CreatePlane("plane" + i, { size: 2 }, scene);
            plane.position = cube.position.add(new Vector3(0, 1.8, 0));
            plane.billboardMode = Mesh.BILLBOARDMODE_ALL; // Always face camera

            const planeTex = AdvancedDynamicTexture.CreateForMesh(plane);
            const label = new TextBlock();
            label.text = cube.answerValue.toString();
            label.color = "white";
            label.fontSize = 90;
            label.outlineColor = "black";
            label.outlineWidth = 8;
            planeTex.addControl(label);
            // --- end label setup ---

            // Click action
            cube.actionManager = new ActionManager(scene);
            cube.actionManager.registerAction(
              new ExecuteCodeAction(ActionManager.OnPickTrigger, () => {
                if (cube.answerValue === currentAnswer) {
                  cube.material.diffuseColor = new Color3(0, 1, 0);
                  score++;
                  scoreText.text = `Score: ${score}`;
                  questionText.text = "✅ Correct!";
                  setTimeout(() => nextQuestion(), 1500);
                } else {
                  cube.material.diffuseColor = new Color3(1, 0, 0);
                  questionText.text = "❌ Wrong! Try again!";
                }
              })
            );
          }
        }

        // Start a new question
        function nextQuestion() {
          const eq = generateEquation();
          currentAnswer = eq.answer;
          questionText.text = `Solve for x: ${eq.question}`;
          spawnAnswers(currentAnswer);
        }

        // Start game
        scoreText.text = "Score: 0";
        nextQuestion();

        return scene;
      };

      const scene = createScene();
      engine.runRenderLoop(() => scene.render());
      window.addEventListener("resize", () => engine.resize());
    </script>
  </body>
</html>
