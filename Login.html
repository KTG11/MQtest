    <style>
        html,body{height:"100%"; margin: "0"}
        body {
            display: grid;
            place-items: center;
            background: linear-gradient(160deg, #0b1220 0%, #0f2540 100%);
            color: #fff;
            font-family: Inter, system-ui, sans-serif;
            overflow: hidden;
        }
        /*to hide the native cursor*/
        *{cursor: none;}

        /*inner dot*/

        .cursor-dot, .cursor-ring {
            position: fixed;
            pointer-events: none;
            left: 0;
            right: 0;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }

        .cursor-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 2px solid rgba(19, 2, 43, 0.925);
            transition: width .12s ease, height .12s ease, opacity .12s ease;    
        }

        .cursor-ring {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid rgba(125,211,252,0.16);
            transform: translate(-50%,-50%);
            transition: transform .12s cubic-bezier(.2,.9,.2,1), border-color .12s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* on hover enlarge ring*/
        .hovering, .cursor-ring {
            transform: translate(-50%,-50%)scale(1.35);
            border-color: rgba(19, 2, 43, 0.925);
        }

        /* demo content*/
        .name {
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 700;
            letter-spacing: -0.02em;

        }

        nav a {
            margin: 0 8px;
            color: #bfeac6;
            text-decoration: none;
            font-weight: 600;
        }

    <body>
        <div class="cursor" id="cursor"></div>

        <script>
            const cursor = document.getElementById("cursor");

            document.addEventListener("mousemove", (e) =>{
                cursor.style.left = e.pageX + "px";
                cursor.style.top = e.pageY + "px";
            });
        </script>

</body>



<body>
    <div style="text-align: center">
        <div class="name">MathsQuest - Your Name Page</div>
        <nav style="margin-top: 16px;">
            <a href="#" class="link">About</a>
            <a href="#" class="link">Projects</a>
            <a href="#" class="link">Contact</a>
        </nav>
    </div>
    

    <div id="dot" class="cursor-dot" aria-hidden="true"></div>
    <div id="ring" class="cursor-ring" aria-hidden="true"></div>

<script>
    const dot= document.getElementById('dot')
    const ring= document.getElementById('ring')
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerWidth / 2;
    let ringX = mouseX, ringY = mouseY;

    document.addEventListener('mousemove'= (e)=>{
        mouseX = e.clientX;
        mouseY = e.clientY;
        dot.style.left = mouseX + 'px';
        dot.style.top = mouseY + 'px'
    });

// smooth follow for ring

    function animate() {
         ringX += (mouseX - ringX) * 0.18;
         ringY += (mouseY - ringY) * 0.18;
         ring.style.left = ringX + 'px';
         ring.style.top  = ringY + 'px';
         requestAnimationFrame(animate);
    }
    animate();

// hover effect on links and buttons
  const hoverables = document.querySelectorAll('a, button, .interactive');
  hoverables.forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
  });

// hide when leaving window
  document.addEventListener('mouseleave', () => {
    dot.style.opacity = '0';
    ring.style.opacity = '0';
  });
  document.addEventListener('mouseenter', () => {
    dot.style.opacity = '1';
    ring.style.opacity = '1';
  });


</script>
</body>
